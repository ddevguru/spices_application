; ==============================================================================
; NATURALE AI VOICE CALLING SYSTEM: PJSIP CONFIGURATION
; Description: Transports, Endpoints, AORs, and SIP Trunk configuration
; ==============================================================================

[global]
type=global
user_agent=Naturale-Asterisk-PBX-1.0

; ------------------------------------------------------------------------------
; 1. UDP Transport for SIP Signalling
; ------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.1/32
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ------------------------------------------------------------------------------
; 2. Local Softphone Test Endpoint (Extension 1001 for testing via MicroSIP/Zoiper)
; ------------------------------------------------------------------------------
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=1001-auth
aors=1001-aor
dtmf_mode=rfc4733
direct_media=no

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=NaturaleSoftphoneTestPass2026!

[1001-aor]
type=aor
max_contacts=2
remove_existing=yes

; ------------------------------------------------------------------------------
; 3. Indian SIP DID Trunk Template (Jio Business Call Forwarding Destination)
; Replace the placeholders with your actual SIP trunk provider credentials
; (e.g., Tata Tele Business, Airtel IQ, Jio SIP Trunk, Voicens, Microtalk)
; ------------------------------------------------------------------------------
[sip-provider-registration]
type=registration
transport=transport-udp
outbound_auth=sip-provider-auth
server_uri=sip:sip.provider.in:5060
client_uri=sip:NATURALE_DID_ACCOUNT@sip.provider.in:5060
retry_interval=60
forbidden_retry_interval=300
expiration=3600

[sip-provider-auth]
type=auth
auth_type=userpass
username=NATURALE_DID_ACCOUNT
password=NATURALE_SIP_TRUNK_PASSWORD

[sip-provider-aor]
type=aor
contact=sip:sip.provider.in:5060

[sip-provider-endpoint]
type=endpoint
context=from-pstn
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=g722
aors=sip-provider-aor
outbound_auth=sip-provider-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
