; ==============================================================================
; NATURALE AI VOICE CALLING SYSTEM: DIALPLAN CONFIGURATION
; Description: Dialplan routing incoming calls from Jio/PSTN & local test softphones
;              directly into the Stasis ARI application: 'naturale-voice-agent'
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RECORDINGS_DIR=/var/spool/asterisk/recording

; ------------------------------------------------------------------------------
; Context: from-pstn (Incoming calls forwarded from Jio Business Number to Indian DID)
; ------------------------------------------------------------------------------
[from-pstn]
exten => _X.,1,NoOp(=== INCOMING NATURALE WHOLESALE CALL FROM ${CALLERID(num)} ===)
 same => n,Set(CALL_START_TIME=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)})
 same => n,Set(RECORDING_FILE=${RECORDINGS_DIR}/call_${CALLERID(num)}_${CALL_START_TIME}.wav)
 same => n,MixMonitor(${RECORDING_FILE},b)
 same => n,Answer()
 same => n,Wait(1)
 ; Handover call to Python AI Voice Engine via Stasis ARI
 same => n,Stasis(naturale-voice-agent,${CALLERID(num)},${UNIQUEID})
 same => n,NoOp(=== CALL COMPLETED FOR ${UNIQUEID} ===)
 same => n,Hangup()

; Catch-all for non-numeric DIDs
exten => s,1,NoOp(=== INCOMING CALL WITHOUT EXTENSION ===)
 same => n,Set(CALL_START_TIME=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)})
 same => n,Set(RECORDING_FILE=${RECORDINGS_DIR}/call_${CALLERID(num)}_${CALL_START_TIME}.wav)
 same => n,MixMonitor(${RECORDING_FILE},b)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Stasis(naturale-voice-agent,${CALLERID(num)},${UNIQUEID})
 same => n,Hangup()

; ------------------------------------------------------------------------------
; Context: from-internal (Local softphone test extension: Dial 7000 from MicroSIP)
; ------------------------------------------------------------------------------
[from-internal]
; Dial 7000 to speak with the AI Voice Agent
exten => 7000,1,NoOp(=== LOCAL SOFTPHONE TEST CALL TO NATURALE AI AGENT ===)
 same => n,Set(CALLERID(num)=9820012345)
 same => n,Set(CALLERID(name)=Test Shopkeeper)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Stasis(naturale-voice-agent,${CALLERID(num)},${UNIQUEID})
 same => n,Hangup()

; Echo test extension 8000 to test softphone audio latency & quality
exten => 8000,1,NoOp(=== ECHO TEST EXTENSION ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

