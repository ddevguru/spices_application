services:
  # ---------------------------------------------------------------------------
  # 1. Node.js + Express Backend REST API
  # ---------------------------------------------------------------------------
  - type: web
    name: dryfruits-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dryfruits-db
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. Next.js Admin Dashboard (Next.js 14 Static Export SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: dryfruits-admin
    env: static
    rootDir: admin_panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: dryfruits-api
          type: web
          property: host

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: dryfruits-db
    databaseName: dryfruits_db
    user: dryfruits_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
